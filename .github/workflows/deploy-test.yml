name: Build Docker Image, Deploy on Test Server

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.string.outputs.DOCKER_IMAGE_NAME_LC }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Apply code formatting with Spotless
        run: ./gradlew spotlessApply

      - name: Run tests
        run: ./gradlew test

      - name: Convert repository name to lowercase
        id: string
        run: echo "DOCKER_IMAGE_NAME_LC=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.string.outputs.DOCKER_IMAGE_NAME_LC }}:test

  # --- ДЕПЛОЙ НА ТЕСТОВЫЙ СТЕК (отдельный Compose project, не трогает прод и не трогает KTStore) ---
  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy new version with Docker Compose
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image_name }}:test
          CONTAINER_NAME: obed-bot-test
          DATA_PATH: /opt/obed-bot-test/data
          LOGS_PATH: /opt/obed-bot-test/logs
        run: |
          cp /opt/obed-bot-test/.env .env

          echo "Pulling latest Docker image: $IMAGE_NAME"
          docker compose -p obed-bot-test pull

          echo "Starting/updating obed-bot-test stack..."
          docker compose -p obed-bot-test up -d

          echo "Cleaning up old images..."
          docker image prune -f

          echo "Deployment finished!"
