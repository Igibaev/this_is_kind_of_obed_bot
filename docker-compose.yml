services:
  bot:
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME:-obed-bot}
    restart: always
    environment:
      - BOT_TOKEN
      - BOT_NAME
      - BOT_TIME_ZONE
      - BOT_MAIN_USER_CHAT_ID
      - DB_URL
      - DB_USERNAME
      - DB_PASSWORD
    volumes:
      - ${LOGS_PATH:-./logs}:/app/logs
    networks:
      - ktstore_shared

networks:
  ktstore_shared:
    external: true
    name: ktstore_default
